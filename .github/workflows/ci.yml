# CI — GitHub Actions.
#
# Actions are pinned to a commit SHA, not a tag: a tag can be moved to point
# at a different commit, a SHA can't. The tag is noted in the comment next
# to each pin so Dependabot (see .github/dependabot.yml) can still propose
# readable upgrades.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The two most recent Go minor releases — currently 1.26 and 1.27.
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: go test -race
        run: go test ./... -race -coverprofile=coverage.out
      - name: go vet
        run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
      - name: go mod tidy -diff
        # Catches go.mod/go.sum drift here, by failing, rather than a
        # release build silently tidying it right before shipping
        # artifacts built from a dependency graph nothing else tested —
        # see .goreleaser.yaml's own comment on why it doesn't run tidy.
        run: go mod tidy -diff
        # `goreleaser check` used to run here to validate .goreleaser.yaml's
        # schema on every PR. Removed once `brews` (docs/decisions/011)
        # made that impossible: `check` treats any deprecated field as a
        # hard failure with no way to allow it, while `release` (even
        # under --snapshot) only warns and still succeeds — confirmed by
        # running both locally side by side. `brews` is deprecated but
        # deliberately kept (its replacement, homebrew_casks, doesn't
        # support Linux at all, which this project ships binaries for),
        # so `check` would fail on every single run regardless of any
        # real problem. The docker-build-check job's own snapshot build
        # below already parses and exercises this same config more
        # thoroughly than `check` ever did — nothing here is losing
        # coverage, just losing a check subcommand that can no longer
        # tell "deprecated, deliberately" apart from "actually broken."

  docker-build-check:
    name: docker build check
    runs-on: ubuntu-latest
    # A separate job, not folded into lint: this builds two full Docker
    # images via buildx (plus every archive target GoReleaser's snapshot
    # mode produces along the way), which is a meaningfully heavier and
    # differently-scoped check than golangci-lint/go mod tidy/goreleaser
    # check above — keeping it apart means a red "lint" status check
    # still means what it's always meant, and a Dockerfile-only failure
    # doesn't hide inside an unrelated job's output.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full history even for a snapshot build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      # dockers_v2 (docs/decisions/010) builds linux/amd64+linux/arm64 in
      # one buildx invocation — see release.yml's identical two steps for
      # why both are required on a bare Actions runner, not just Docker
      # Desktop (where this worked with no setup at all during local
      # testing, which is exactly the gap this job exists to catch).
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "2.18.1" # matches release.yml's pin
          args: release --snapshot --clean --skip=publish
        # This is now the only .goreleaser.yaml validation in CI — see the
        # lint job's own comment for why the schema-only `check`
        # subcommand was removed. A real (unpushed) snapshot build here
        # catches strictly more: a broken multi-arch buildx setup, a typo
        # in $TARGETPLATFORM, or a genuine config error, all with no
        # signal before a real tag push otherwise fails inside
        # release.yml.

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: go build
        run: go build -o /dev/null ./cmd/dashsync

  e2e:
    name: e2e (real Docker)
    runs-on: ubuntu-latest
    # GitHub's ubuntu-latest runners ship a working Docker daemon out of
    # the box — the exact thing the "integration" build tag exists to
    # require — so this needs no docker-in-docker setup, just the tag.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: go test -tags=integration
        run: go test -tags=integration ./... -race -v

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: govulncheck
        run: govulncheck ./...
